# Self-hosted storage and future database. Keep ports private to loopback.
# No Firebase or R2 data is automatically imported by starting this stack.
name: amorri-vps
services:
  object-storage:
    image: rustfs/rustfs:1.0.4
    container_name: amorri-object-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AMORRI_S3_ACCESS_KEY_ID:?Set access key}
      RUSTFS_SECRET_KEY: ${AMORRI_S3_SECRET_ACCESS_KEY:?Set secret}
      RUSTFS_REGION: us-east-1
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - object_data:/data
    command: ['/data']
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: amorri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amorri
      POSTGRES_USER: amorri
      POSTGRES_PASSWORD: ${AMORRI_POSTGRES_PASSWORD:?Set PostgreSQL password}
    ports:
      - '127.0.0.1:5543:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amorri -d amorri']
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  object_data:
  postgres_data:
