# Inside nginx http{} (e.g. sites-enabled), a shared zone throttles all web workers.
# Preserve this directive in the live HTTPS site after Certbot edits.
limit_req_zone $binary_remote_addr zone=amorri_login_ip:10m rate=6r/m;
# Stage HTTP first, then: sudo certbot --nginx -d amorri.io.vn -d media.amorri.io.vn
# Both A records MUST point to 180.93.43.162 first.
server {
    listen 80;
    listen [::]:80;
    server_name amorri.io.vn;
    client_max_body_size 50m;
    # Apply strict IP rate limiting at the reverse proxy. Unlike Next.js Map,
    # this survives app restarts and is shared across Node workers.
    location = /api/auth/local/login {
        limit_req zone=amorri_login_ip burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3304;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3304;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name media.amorri.io.vn;
    # This virtual host is an authenticated S3 API; no anonymous/public buckets.
    # SigV4 signs the incoming Host. DO NOT rewrite it to 127.0.0.1.
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
