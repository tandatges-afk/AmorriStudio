appId: vn.amorri.studio.desktop
productName: Amorri Studio
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets/tools.html
    to: tools.html
  - from: assets/tools.js
    to: tools.js
  - from: assets/tools.css
    to: tools.css
  - from: assets/picker.html
    to: picker.html
  - from: assets/picker.js
    to: picker.js
  - from: assets/picker.css
    to: picker.css
  - from: desktop.config.json
    to: desktop.config.json
  - from: assets/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
mac:
  icon: assets/icon.icns
  category: public.app-category.photography
  identity: "-"
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: 'Amorri Studio Setup ${version}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Amorri Studio
publish: null
