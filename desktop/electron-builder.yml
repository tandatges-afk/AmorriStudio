appId: vn.amorri.studio.desktop
productName: Amorri Studio
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets/amorri-logo.png
    to: amorri-logo.png
  - from: assets/amorri-brand.css
    to: amorri-brand.css
  - from: assets/tools.html
    to: tools.html
  - from: assets/tools.js
    to: tools.js
  - from: assets/tools.css
    to: tools.css
  - from: assets/picker.html
    to: picker.html
  - from: assets/picker.js
    to: picker.js
  - from: assets/picker.css
    to: picker.css
  - from: assets/premium-tools.css
    to: premium-tools.css
  - from: assets/premium-picker.css
    to: premium-picker.css
  - from: assets/premium-drive-sync.js
    to: premium-drive-sync.js
  - from: assets/premium-picker-ux.js
    to: premium-picker-ux.js
  - from: assets/premium-queue.css
    to: premium-queue.css
  - from: assets/premium-queue.js
    to: premium-queue.js
  - from: desktop.config.json
    to: desktop.config.json
  - from: assets/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
mac:
  icon: assets/icon.icns
  category: public.app-category.photography
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: 'Amorri Studio Setup ${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Amorri Studio
publish:
  provider: generic
  url: https://amorri.io.vn/desktop-updates/
