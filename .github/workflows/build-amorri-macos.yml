name: Amorri Desktop - Build macOS ARM64 and Intel DMG (VPS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Prepare VPS and Google OAuth Desktop runtime config
        env:
          AMORRI_CONFIG_JSON: ${{ secrets.AMORRI_DESKTOP_CONFIG_JSON || secrets.AMORRI_MAC_CONFIG_JSON }}
        run: node scripts/prepare-release-config.mjs
      - name: Verify configuration and compile
        run: |
          node scripts/prepare-release-config.mjs --verify
          npm run typecheck
          npm run build:main
          npm run test:desktop
          node --test tests/google-drive-oauth-131.test.mjs
      - name: Build unsigned macOS Apple Silicon and Intel DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.yml --mac dmg --arm64 --x64 --publish never
      - name: Verify bundled runtime points to VPS
        run: |
          FILE="$(find release -path '*/Contents/Resources/desktop.config.json' -type f -print -quit)"
          test -n "$FILE"
          cmp -s desktop.config.json "$FILE"
          echo 'Bundled runtime config OK (values hidden)'
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Amorri-Studio-macOS-DMG-VPS
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7
