name: Amorri 1.3.8 - Windows + signed macOS candidates (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      signed_mac:
        description: 'Build signed and notarized Mac DMG and ZIP (requires Apple Developer credentials)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: amorri-desktop-138-candidate
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref_name == 'upgrade/desktop-autoupdate-130'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check exact version and lock
        shell: pwsh
        run: |
          node -p "require('./package.json').version"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.3.8') { throw 'STOP: Expected Desktop 1.3.8' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne $pkg.version -or $lock.packages[''].version -ne $pkg.version) { throw 'STOP: package-lock version mismatch' }
      - run: npm ci
      - name: Prepare Desktop public-client configuration
        env:
          AMORRI_CONFIG_JSON: ${{ secrets.AMORRI_DESKTOP_CONFIG_JSON || secrets.AMORRI_WIN_CONFIG_JSON }}
        run: node scripts/prepare-release-config.mjs
      - name: Validate config and Desktop tests
        run: |
          node scripts/prepare-release-config.mjs --verify
          npm run typecheck
          npm run test:desktop
          npm run test:auto-update
      - name: Fetch SHA256-pinned ExifTool Windows
        shell: pwsh
        run: ./scripts/prepare-exiftool-win.ps1
      - name: Package unsigned Windows NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:main
          npx electron-builder --config electron-builder.yml --win nsis --x64 --publish never
      - name: Verify Windows artifact and bundled ExifTool
        shell: pwsh
        run: |
          $tool='release/win-unpacked/resources/bin/exiftool.exe'
          if (!(Test-Path $tool)) { throw 'STOP: Windows ExifTool missing from build' }
          $v=@(& $tool -ver)
          if ($LASTEXITCODE -ne 0 -or (($v -join '').Trim() -ne '13.61')) { throw 'STOP: Invalid ExifTool' }
          if (!(Test-Path 'release/latest.yml')) { throw 'STOP: latest.yml missing' }
          if (!(Test-Path 'release/win-unpacked/resources/desktop.config.json')) { throw 'STOP: Config missing' }
      - name: Upload Windows candidate, not deploy
        uses: actions/upload-artifact@v4
        with:
          name: Amorri-1.3.8-Windows-x64-candidate
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  macos:
    if: github.ref_name == 'upgrade/desktop-autoupdate-130' && inputs.signed_mac == true
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Require Apple signing/notarization configuration
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'STOP: Mac Developer ID and notarization credentials required'; exit 1; }
      - run: npm ci
      - name: Prepare Desktop public-client configuration
        env:
          AMORRI_CONFIG_JSON: ${{ secrets.AMORRI_DESKTOP_CONFIG_JSON || secrets.AMORRI_MAC_CONFIG_JSON }}
        run: node scripts/prepare-release-config.mjs
      - name: Validate Desktop and updater
        run: |
          node scripts/prepare-release-config.mjs --verify
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.version!=="1.3.8"||l.version!==p.version||l.packages[""].version!==p.version)process.exit(1)'
          npm run typecheck
          npm run test:desktop
          npm run test:auto-update
      - name: Build, sign and notarize Mac arm64 + x64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build:main
          npx electron-builder --config electron-builder.yml --mac dmg zip --arm64 --x64 --publish never
      - name: Verify Mac signatures and updater manifest
        run: |
          test -f release/latest-mac.yml || { echo 'STOP: latest-mac.yml missing'; exit 1; }
          found=0
          while IFS= read -r -d '' app; do
            found=$((found+1))
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
          done < <(find release -name '*.app' -type d -print0)
          test "$found" -gt 0 || { echo 'STOP: Signed Mac app missing'; exit 1; }
      - name: Upload signed Mac candidate, not deploy
        uses: actions/upload-artifact@v4
        with:
          name: Amorri-1.3.8-macOS-signed-candidate
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7
