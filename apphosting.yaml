# Amorri Studio VNext 2.9.0.3 — Firebase App Hosting (not static Firebase Hosting).
# Deploy via Firebase Console > App Hosting, linked to a GitHub branch.
# Next.js' standard npm run build/start are inferred by App Hosting.
# DO NOT commit private keys, tokens, admin UIDs or your real .env files.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 25
  cpu: 1
  memoryMiB: 1024

env:
  # Preserve the project and RTDB URL; NOT interchangeable with your Drive project.
  - variable: FIREBASE_PROJECT_ID
    value: ammori-c4905
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_DATABASE_URL
    value: https://ammori-c4905-default-rtdb.europe-west1.firebasedatabase.app
    availability:
      - BUILD
      - RUNTIME

  # Nonsecret browser-facing Firebase app identifiers.
  # Add NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_APP_ID,
  # NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN, NEXT_PUBLIC_FIREBASE_DATABASE_URL,
  # NEXT_PUBLIC_FIREBASE_PROJECT_ID in Firebase Console > App Hosting >
  # Settings > Environment. Copy exact values from the existing project.
  # Firebase Console values override those declared in this YAML.

  # Create these named secrets in Google Cloud Secret Manager BEFORE rollout.
  # firebase apphosting:secrets:set <name> --project ammori-c4905
  # Grant this backend read access using Firebase CLI when prompted, or via
  # firebase apphosting:secrets:grantaccess <name> --backend <backend-id> ...
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: amorriFirebaseAdminJson
    availability:
      - RUNTIME
  - variable: DRIVE_SERVICE_ACCOUNT_JSON
    secret: amorriDriveServiceAccountJson
    availability:
      - RUNTIME
  - variable: DRIVE_VIDEO_SIGNING_SECRET
    secret: amorriDriveVideoSigningSecret
    availability:
      - RUNTIME

  # Optional but recommended once an existing key is migrated into Secret Manager:
  # - variable: AMORRI_ARCHIVE_ENCRYPTION_KEY
  #   secret: amorriArchiveEncryptionKey
  #   availability:
  #     - RUNTIME
  # DO NOT rotate encryption or signing keys without a recovery plan.
